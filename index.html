<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUKSION PRO — Janly Bäsleşik Platformasy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0b0c10;
      --bg-card: #14161d;
      --bg-input: #1e212b;
      --gold: #f5b942;
      --gold-hover: #ffd166;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --success: #10b981;
      --border: #2a2e3b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; }

    /* Navbar */
    header {
      background: rgba(20, 22, 29, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--gold); letter-spacing: 1px; }
    .logo span { color: #fff; }
    .nav-actions { display: flex; gap: 12px; align-items: center; }

    /* Buttons & Inputs */
    button {
      background: var(--gold);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: var(--gold-hover); transform: translateY(-1px); }
    button.secondary { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); }
    button.secondary:hover { border-color: var(--gold); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    input, textarea, select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--gold); }

    /* Main Layout */
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }
    .section-title { font-size: 1.4rem; margin-bottom: 1.5rem; border-left: 4px solid var(--gold); padding-left: 12px; }

    /* Grid */
    .auction-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 24px;
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }
    .card:hover { border-color: var(--gold); box-shadow: 0 10px 25px rgba(245, 185, 66, 0.1); }
    .card-img { width: 100%; height: 210px; object-fit: cover; background: #1a1d24; }
    .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
    .card-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 14px; flex: 1; }
    
    .price-box {
      background: var(--bg-dark);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .current-price { font-size: 1.35rem; font-weight: 800; color: var(--gold); }
    .timer { font-weight: 700; color: var(--success); font-variant-numeric: tabular-nums; }
    .timer.urgent { color: var(--danger); animation: pulse 1s infinite; }
    .leader-info { font-size: 0.8rem; color: var(--text-muted); }

    .bid-controls { display: flex; gap: 8px; }
    .bid-controls input { margin: 0; }

    /* Modals */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--gold);
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      padding: 0;
    }
    .badge {
      background: rgba(245, 185, 66, 0.15);
      color: var(--gold);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    @keyframes pulse { 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<header>
  <div class="logo">AUKSION<span>PRO Owner: Aşyr ✓</span></div>
  <div class="nav-actions" id="nav-actions">
    <button onclick="openModal('auth-modal')">Giriş / Registrasiýa</button>
  </div>
</header>

<div class="container">
  <h2 class="section-title">Janly Auksionlar (Bäsleşik)</h2>
  <div class="auction-grid" id="auction-list">
    <p style="color: var(--text-muted);">Auksionlar ýüklenýär...</p>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal" id="auth-modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('auth-modal')">&times;</button>
    <h3 style="margin-bottom: 14px; color: var(--gold);">Hasaba Giriş ýa-da Täze Hasap</h3>
    <label>E-poçta (Email)</label>
    <input type="email" id="auth-email" placeholder="mysal@gmail.com" />
    <label>Parol (Iň az 6 nyşan)</label>
    <input type="password" id="auth-password" placeholder="••••••" />
    <div style="display: flex; gap: 10px;">
      <button style="flex: 1;" onclick="handleAuth('login')">Giriş Etmek</button>
      <button style="flex: 1;" class="secondary" onclick="handleAuth('signup')">Registrasiýa</button>
    </div>
  </div>
</div>

<!-- CREATE AUCTION MODAL -->
<div class="modal" id="create-modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal('create-modal')">&times;</button>
    <h3 style="margin-bottom: 14px; color: var(--gold);">Täze Auksion Başlatmak</h3>
    <label>Harydyň Ady</label>
    <input type="text" id="item-title" placeholder="Meselem: iPhone 15 Pro Max 256GB" />
    <label>Beýany (Ýagdaýy, aýratynlyklary)</label>
    <textarea id="item-desc" rows="2" placeholder="Täze ýaly, karobkasy bar..."></textarea>
    <label>Harydyň Suraty</label>
    <input type="file" id="item-image" accept="image/*" />
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label>Başlangyç Baha (TMT)</label>
        <input type="number" id="item-price" value="100" min="1" />
      </div>
      <div style="flex: 1;">
        <label>Iň Az Ädim (TMT)</label>
        <input type="number" id="item-step" value="10" min="1" />
      </div>
    </div>
    <label>Auksionyň Dowamlylygy</label>
    <select id="item-duration">
      <option value="5">5 Minut (Synag üçin)</option>
      <option value="60">1 Sagat</option>
      <option value="360">6 Sagat</option>
      <option value="1440" selected>24 Sagat (1 Gün)</option>
      <option value="4320">3 Gün</option>
    </select>
    <button style="width: 100%;" id="create-btn" onclick="createAuction()">Auksiony Ýaýlyma Goýbermek</button>
  </div>
</div>

<script>
  // === SUPABASE SAZLAMALARY (Siziň maglumatlaryňyz göni girizildi) ===
  const SUPABASE_URL = 'https://wlgdcpzxhtmwxuarwesk.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsZ2RjcHp4aHRtd3h1YXJ3ZXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NDcwMzIsImV4cCI6MjExMDAyMzAzMn0.DLpu_QCs0YYKuX0EWoPSuPE5mwKey1XlvNUXecAJ2zk';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentUser = null;
  let profilesMap = {};
  let auctionsData = [];

  // Başlangyç
  async function init() {
    const { data: { session } } = await db.auth.getSession();
    currentUser = session?.user || null;
    updateNavbar();

    db.auth.onAuthStateChange((_event, session) => {
      currentUser = session?.user || null;
      updateNavbar();
      renderAuctions();
    });

    await loadProfiles();
    await loadAuctions();
    subscribeRealtime();
    setInterval(updateTimers, 1000);
  }

  function updateNavbar() {
    const nav = document.getElementById('nav-actions');
    if (currentUser) {
      const uname = profilesMap[currentUser.id] || currentUser.email.split('@')[0];
      nav.innerHTML = `
        <span class="badge">👤 ${uname}</span>
        <button onclick="openModal('create-modal')">+ Auksion Goş</button>
        <button class="secondary" onclick="logout()">Çykmak</button>
      `;
    } else {
      nav.innerHTML = `<button onclick="openModal('auth-modal')">Giriş / Registrasiýa</button>`;
    }
  }

  async function loadProfiles() {
    const { data } = await db.from('profiles').select('id, username');
    if (data) {
      data.forEach(p => profilesMap[p.id] = p.username);
    }
  }

  async function loadAuctions() {
    const { data, error } = await db
      .from('auctions')
      .select('*')
      .order('created_at', { ascending: false });

    if (!error && data) {
      auctionsData = data;
      renderAuctions();
    }
  }

  // Real-Time: Täze stawka ýa-da täze haryt goşulanda awtomatiki täzelenýär
  function subscribeRealtime() {
    db.channel('public:auctions')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'auctions' }, async () => {
        await loadProfiles();
        await loadAuctions();
      })
      .subscribe();
  }

  function renderAuctions() {
    const list = document.getElementById('auction-list');
    if (auctionsData.length === 0) {
      list.innerHTML = '<p style="color: var(--text-muted);">Häzirlikçe işjeň auksion ýok. Ilkinji bolup özüňiz goşuň!</p>';
      return;
    }

    list.innerHTML = auctionsData.map(item => {
      const isEnded = new Date(item.ends_at) <= new Date();
      const nextMinBid = Number(item.current_price) + (item.winner_id ? Number(item.min_step) : 0);
      const sellerName = profilesMap[item.seller_id] || 'Satyjy';
      const winnerName = item.winner_id ? (profilesMap[item.winner_id] || 'Gatnaşyjy') : 'Entek stawka ýok';
      const isOwner = currentUser && currentUser.id === item.seller_id;

      return `
        <div class="card">
          <img class="card-img" src="${item.image_url || 'https://via.placeholder.com/400x220/1a1d24/f5b942?text=Surat+Yok'}" alt="${item.title}" />
          <div class="card-body">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span style="font-size:0.8rem; color:var(--gold);">Satyjy: ${sellerName}</span>
              <span style="font-size:0.8rem; color:var(--text-muted);">Ädim: +${item.min_step} TMT</span>
            </div>
            <div class="card-title">${item.title}</div>
            <div class="card-desc">${item.description || ''}</div>
            
            <div class="price-box">
              <div class="price-row">
                <span style="font-size:0.85rem; color:var(--text-muted);">Häzirki baha:</span>
                <span class="current-price">${item.current_price} TMT</span>
              </div>
              <div class="price-row">
                <span class="leader-info">🏆 Öňdebaryjy: <b>${winnerName}</b></span>
                <span class="timer" data-ends="${item.ends_at}">...</span>
              </div>
            </div>

            ${isEnded 
              ? `<button disabled style="width:100%; background:#374151; color:#9ca3af;">Auksion Tamamlandy</button>`
              : isOwner 
                ? `<button disabled class="secondary" style="width:100%;">Bu Siziň Öz Auksionyňyz</button>`
                : `<div class="bid-controls">
                    <input type="number" id="bid-input-${item.id}" value="${nextMinBid}" min="${nextMinBid}" />
                    <button onclick="placeBid('${item.id}')">Stawka Goý</button>
                  </div>`
            }
          </div>
        </div>
      `;
    }).join('');
    updateTimers();
  }

  // Taýmerleri her sekunt täzelemek
  function updateTimers() {
    document.querySelectorAll('.timer').forEach(el => {
      const endsAt = new Date(el.getAttribute('data-ends'));
      const diff = endsAt - new Date();

      if (diff <= 0) {
        el.textContent = 'Gutardy';
        el.classList.remove('urgent');
        return;
      }

      const hrs = Math.floor(diff / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      el.textContent = `${hrs}s ${mins}m ${secs}sek`;
      if (diff < 20000) el.classList.add('urgent');
      else el.classList.remove('urgent');
    });
  }

  // Registrasiýa we Giriş
  async function handleAuth(type) {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if (!email || !password) return alert('E-poçta we paroly ýazyň!');

    const { error } = type === 'login'
      ? await db.auth.signInWithPassword({ email, password })
      : await db.auth.signUp({ email, password });

    if (error) alert('Ýalňyşlyk: ' + error.message);
    else {
      closeModal('auth-modal');
      await loadProfiles();
      updateNavbar();
    }
  }

  async function logout() {
    await db.auth.signOut();
  }

  // Täze auksion döretmek
  async function createAuction() {
    if (!currentUser) return alert('Ilki bilen ulgama giriň!');

    const title = document.getElementById('item-title').value.trim();
    const description = document.getElementById('item-desc').value.trim();
    const startPrice = Number(document.getElementById('item-price').value);
    const minStep = Number(document.getElementById('item-step').value);
    const durationMins = Number(document.getElementById('item-duration').value);
    const fileInput = document.getElementById('item-image');

    if (!title || startPrice <= 0) return alert('Harydyň adyny we bahasyny dogry giriziň!');

    const btn = document.getElementById('create-btn');
    btn.disabled = true;
    btn.textContent = 'Ýüklenýär...';

    let imageUrl = null;
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
      const { error: uploadErr } = await db.storage.from('auction-images').upload(fileName, file);
      if (!uploadErr) {
        const { data: urlData } = db.storage.from('auction-images').getPublicUrl(fileName);
        imageUrl = urlData.publicUrl;
      }
    }

    const endsAt = new Date(Date.now() + durationMins * 60000).toISOString();

    const { error } = await db.from('auctions').insert({
      seller_id: currentUser.id,
      title,
      description,
      image_url: imageUrl,
      start_price: startPrice,
      current_price: startPrice,
      min_step: minStep,
      ends_at: endsAt
    });

    btn.disabled = false;
    btn.textContent = 'Auksiony Ýaýlyma Goýbermek';

    if (error) alert('Ýalňyşlyk: ' + error.message);
    else {
      closeModal('create-modal');
      document.getElementById('item-title').value = '';
      document.getElementById('item-desc').value = '';
    }
  }

  // Stawka goýmak
  async function placeBid(auctionId) {
    if (!currentUser) return openModal('auth-modal');

    const amount = Number(document.getElementById(`bid-input-${auctionId}`).value);
    const { error } = await db.rpc('place_bid', {
      p_auction_id: auctionId,
      p_amount: amount
    });

    if (error) alert(error.message);
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  init();
</script>
</body>
</html>
